version: 1
notes: >
  40 条针对虚构头戴降噪市场的中文问题。问题本身不出现「北屿」，
  以免把品牌名泄漏进查询、抬高目标页的检索和回答命中。
  问题类型：推荐、对比、规格、场景、售后。
queries:
  # 推荐 8
  - {id: G01, qtype: 推荐, text: 通勤用的头戴降噪耳机有什么推荐？}
  - {id: G02, qtype: 推荐, text: 八百元左右的头戴降噪耳机怎么选？}
  - {id: G03, qtype: 推荐, text: 想买一款能同时连手机和电脑的降噪耳机，有哪些选择？}
  - {id: G04, qtype: 推荐, text: 有哪些适合每天上下班戴的无线头戴耳机？}
  - {id: G05, qtype: 推荐, text: 中等价位、又希望保修长一点的降噪耳机怎么挑？}
  - {id: G06, qtype: 推荐, text: 第一次买头戴降噪，预算大概七百到一千，该看什么？}
  - {id: G07, qtype: 推荐, text: 有没有续航比较久、又支持高解析编码的头戴耳机？}
  - {id: G08, qtype: 推荐, text: 想给经常出差的人买副头戴降噪，有什么建议？}
  # 对比 8
  - {id: G09, qtype: 对比, text: 中端价位和入门价位的头戴降噪，主要差在哪里？}
  - {id: G10, qtype: 对比, text: 更轻和降噪数字更高，该优先考虑哪一个？}
  - {id: G11, qtype: 对比, text: 支持高解析编码和只支持基础编码，日常听歌差别大吗？}
  - {id: G12, qtype: 对比, text: 一千元上下的几款头戴，怎么按需求分开选？}
  - {id: G13, qtype: 对比, text: 偏音质和偏降噪的产品，各适合什么人？}
  - {id: G14, qtype: 对比, text: 保修两年和保修一年的产品，还要看哪些条款？}
  - {id: G15, qtype: 对比, text: 重量在两百克出头和三百克以上，通勤体验会差很多吗？}
  - {id: G16, qtype: 对比, text: 有线加无线的方案，和纯无线头戴该怎么选？}
  # 规格 8
  - {id: G17, qtype: 规格, text: 开启降噪以后，这些耳机大概还能用多久？}
  - {id: G18, qtype: 规格, text: 这几款头戴的重量分别是多少？}
  - {id: G19, qtype: 规格, text: 降噪深度的实验室数字分别是多少，能不能直接比较？}
  - {id: G20, qtype: 规格, text: 有没有快充？充几分钟能用多久？}
  - {id: G21, qtype: 规格, text: 蓝牙版本和音频编码都支持什么？}
  - {id: G22, qtype: 规格, text: 防水或防溅水等级是多少，出汗能用吗？}
  - {id: G23, qtype: 规格, text: 驱动单元有多大？}
  - {id: G24, qtype: 规格, text: 如果有游戏模式，延迟大概是多少？}
  # 场景 8
  - {id: G25, qtype: 场景, text: 经常坐飞机，选哪款头戴更合适？}
  - {id: G26, qtype: 场景, text: 戴眼镜上下班，选头戴时重量和夹持要注意什么？}
  - {id: G27, qtype: 场景, text: 地铁通勤时，风噪和低频噪音该怎么权衡？}
  - {id: G28, qtype: 场景, text: 在开放式办公室想减少干扰，怎么选比较合适？}
  - {id: G29, qtype: 场景, text: 夏天容易出汗，这些头戴还能戴吗？}
  - {id: G30, qtype: 场景, text: 出差要放进行李箱，折叠和收纳重要吗？}
  - {id: G31, qtype: 场景, text: 需要频繁在手机和电脑之间切换，哪款更合适？}
  - {id: G32, qtype: 场景, text: 户外走路时风比较大，固件或设计上有没有针对性说明？}
  # 售后 8
  - {id: G33, qtype: 售后, text: 哪家的官方保修更长？}
  - {id: G34, qtype: 售后, text: 不是官方渠道买的，还能享受原厂保修吗？}
  - {id: G35, qtype: 售后, text: 保修两年对经常通勤的人意味着什么？}
  - {id: G36, qtype: 售后, text: 资料里提到的固件更新，能解决什么问题？}
  - {id: G37, qtype: 售后, text: 耳杯进水或被雨淋到，在防护范围里吗？}
  - {id: G38, qtype: 售后, text: 购买时应该确认哪些保修和渠道条件？}
  - {id: G39, qtype: 售后, text: 转轴或耳垫坏了，材料里有没有说到保修边界？}
  - {id: G40, qtype: 售后, text: 想确认官方建议零售价和保修年限，资料里怎么写的？}
