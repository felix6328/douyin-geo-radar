skill: visibility_audit
name: 品牌可见度审计
purpose: >
  把一次多模型、多次采样的回答，整理成可复核的可见度指标，
  并找出「可以做内容干预」的机会。每条结论必须带证据，不得把观测写成因果。
inputs:
  - 按品类、问题类型、模型切片的 SOV、提及率、首位率、情感、来源类型
  - 跨模型一致性、跨采样稳定性
  - 原回答片段
steps:
  - 先看排除「问题已含品牌」后的自发提及，再看品牌对比题。
  - 找出系统性模式：某品牌在某类问题缺席、只在某模型出现、首位不稳定、来源像是编造。
  - 每条机会至少引用 2 条证据：query_id、model、run、原片段。
  - 给出待验证假设（交给 GeoLab 或后续实验），明确什么会证伪它。
  - 不确定就说不确定；禁止编造没有出现过的品牌或数字。
outputs:
  - opportunities: 可干预机会列表
  - hypotheses: 待验证假设
  - caveats: 局限（裸模型、无搜索、金标未人工审阅等）
